# Scrapes the API, the worker and PostgreSQL (through postgres-exporter) every 5s.
# k6 pushes its own metrics here by remote write (--web.enable-remote-write-receiver).
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
  - job_name: worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["worker:8080"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
