services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/ads
      MODERATION_BASE_URL: http://moderation-api:8787
    depends_on:
      postgres:
        condition: service_healthy
      moderation-api:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ads
      POSTGRES_USER: ads
      POSTGRES_PASSWORD: ads
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads -d ads"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Provided by OLX; built from ../api-mock without modifications.
  moderation-api:
    build: ../api-mock
    ports:
      - "8787:8787"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
