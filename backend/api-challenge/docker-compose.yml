# The API and the moderation worker run the same image as separate services: the API scales
# with traffic, the worker stays at one replica (DECISIONS.md, 3).
x-app: &app
  image: ads-api:local
  depends_on:
    postgres:
      condition: service_healthy
    moderation-api:
      condition: service_healthy

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: docker
  DB_URL: jdbc:postgresql://postgres:5432/ads
  MODERATION_BASE_URL: http://moderation-api:8787

services:
  api:
    <<: *app
    build: . # built once; the worker reuses the image
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      MODERATION_WORKER_ENABLED: "false"

  worker:
    <<: *app
    pull_policy: never
    environment:
      <<: *app-env
      MODERATION_WORKER_ENABLED: "true"
      SEED_ENABLED: "false" # the API imports the seed

  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5433:5432" # local only: the credentials below are for development
    environment:
      POSTGRES_DB: ads
      POSTGRES_USER: ads
      POSTGRES_PASSWORD: ads
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads -d ads"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Provided by OLX; built from ../api-mock without modifications.
  moderation-api:
    build: ../api-mock
    ports:
      - "8787:8787"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
