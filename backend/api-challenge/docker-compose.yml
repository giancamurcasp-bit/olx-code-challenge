# The API and the moderation worker run the same image as separate services: the API scales
# with traffic, the worker stays at one replica (DECISIONS.md, 3).
x-app: &app
  image: ads-api:local
  depends_on:
    postgres:
      condition: service_healthy
    moderation-api:
      condition: service_healthy

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: docker
  DB_URL: jdbc:postgresql://postgres:5432/ads
  MODERATION_BASE_URL: http://moderation-api:8787

services:
  api:
    <<: *app
    build: . # built once; the worker reuses the image
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      MODERATION_WORKER_ENABLED: "false"

  worker:
    <<: *app
    pull_policy: never
    environment:
      <<: *app-env
      MODERATION_WORKER_ENABLED: "true"
      SEED_ENABLED: "false" # the API imports the seed

  postgres:
    image: postgres:18-alpine
    # Per-query statistics for the load test dashboards; negligible overhead otherwise.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "127.0.0.1:5433:5432" # local only: the credentials below are for development
    environment:
      POSTGRES_DB: ads
      POSTGRES_USER: ads
      POSTGRES_PASSWORD: ads
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads -d ads"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Provided by OLX; built from ../api-mock without modifications.
  moderation-api:
    build: ../api-mock
    ports:
      - "8787:8787"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Load test and metrics (loadtest/README.md); off unless a profile is selected ---

  # Enables pg_stat_statements in the database once, for postgres-exporter.
  postgres-stats:
    image: postgres:18-alpine
    profiles: [observability]
    environment:
      PGPASSWORD: ads
    command: ["psql", "-h", "postgres", "-U", "ads", "-d", "ads", "-c", "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [observability]
    command:
      - --collector.stat_statements
      - --extend.query-path=/etc/postgres-exporter/queries.yml
    environment:
      DATA_SOURCE_NAME: postgresql://ads:ads@postgres:5432/ads?sslmode=disable
    volumes:
      - ./observability/postgres-exporter-queries.yml:/etc/postgres-exporter/queries.yml:ro
    depends_on:
      postgres-stats:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # local only: no login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ads-api.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Run with: docker compose run --rm k6 run /scripts/<scenario>.js
  k6:
    image: grafana/k6:1.2.2
    profiles: [loadtest]
    environment:
      BASE_URL: http://api:8080
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),avg,max
    volumes:
      - ./loadtest:/scripts:ro

volumes:
  postgres-data:
