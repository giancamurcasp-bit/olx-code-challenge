spring:
  application:
    name: ads-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ads}
    username: ${DB_USERNAME:ads}
    password: ${DB_PASSWORD:ads}
  jackson:
    property-naming-strategy: SNAKE_CASE

moderation:
  base-url: ${MODERATION_BASE_URL:http://localhost:8787}
  connect-timeout: 1s
  read-timeout: 3s # the provider's maximum latency is 2s
  worker:
    enabled: true
    poll-interval: 1s
    batch-size: 10
    lease: 30s # if a slow batch outlives it, the stale write is discarded (fencing)

resilience4j:
  ratelimiter:
    instances:
      moderation:
        limit-for-period: 4 # the provider allows 5 req/s; stay below it
        limit-refresh-period: 1s
        timeout-duration: 5s # how long a call waits for a permit before being deferred
  circuitbreaker:
    instances:
      moderation:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50 # the provider's normal error rate is ~20%
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true # the worker polls the state

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

---
spring:
  config:
    activate:
      on-profile: docker

logging:
  structured:
    format:
      console: ecs
