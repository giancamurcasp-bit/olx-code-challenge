spring:
  application:
    name: ads-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ads}
    username: ${DB_USERNAME:ads}
    password: ${DB_PASSWORD:ads}
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

---
spring:
  config:
    activate:
      on-profile: docker

logging:
  structured:
    format:
      console: ecs
