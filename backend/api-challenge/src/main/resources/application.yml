spring:
  application:
    name: ads-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ads}
    username: ${DB_USERNAME:ads}
    password: ${DB_PASSWORD:ads}
  jackson:
    property-naming-strategy: SNAKE_CASE

moderation:
  base-url: ${MODERATION_BASE_URL:http://localhost:8787}
  connect-timeout: 1s
  read-timeout: 3s # the provider's maximum latency is 2s
  worker:
    enabled: true
    poll-interval: 1s
    batch-size: 10
    lease: 30s # longer than the read timeout, so a live worker never loses its claim

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

---
spring:
  config:
    activate:
      on-profile: docker

logging:
  structured:
    format:
      console: ecs
