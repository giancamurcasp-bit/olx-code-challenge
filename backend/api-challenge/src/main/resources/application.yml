spring:
  application:
    name: ads-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ads}
    username: ${DB_USERNAME:ads}
    password: ${DB_PASSWORD:ads}
  jackson:
    property-naming-strategy: SNAKE_CASE

seed:
  enabled: true # imports the mock's 57 example ads at startup (idempotent)

moderation:
  base-url: ${MODERATION_BASE_URL:http://localhost:8787}
  connect-timeout: 1s
  read-timeout: 3s # the provider's maximum latency is 2s
  worker:
    enabled: true
    poll-interval: 1s
    batch-size: 20
    # Provider calls in flight: rate x latency = 4 req/s x 2s (the provider's max latency). More
    # wouldn't be faster (the rate limiter caps at 4 req/s); fewer drops below 4 req/s when slow.
    concurrency: 8
    # Safety net if an instance dies holding the worker lock; longer than the worst-case run
    # (20 ads / 8 in flight = 3 rounds x (5s permit wait + 3s timeout) = 24s).
    lock-at-most-for: 2m
    lease: 30s # if a slow batch outlives it, the stale write is discarded (fencing)

resilience4j:
  ratelimiter:
    instances:
      moderation:
        # 4 req/s, below the provider's 5, as 1 permit every 250ms: the provider counts a sliding
        # 1s window, so "4 per 1s period" would let 8 calls through around a period boundary.
        limit-for-period: 1
        limit-refresh-period: 250ms
        timeout-duration: 5s # how long a call waits for a permit before being deferred
  circuitbreaker:
    instances:
      moderation:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50 # the provider's normal error rate is ~20%
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true # the worker polls the state

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

---
spring:
  config:
    activate:
      on-profile: docker

logging:
  structured:
    format:
      console: ecs
